_format_version: "2.1"

services:
  - name: products-svc
    url: http://products_upstream
    routes:
      - name: products-route
        paths: ["/products"]
        strip_path: false


upstreams:
  - name: products_upstream
    healthchecks:
      active:
        http_path: /products/health   # <-- health de PRODUCTS
        healthy:   { successes: 2 }
        unhealthy: { http_failures: 2, tcp_failures: 2 }
        interval: 5
    targets:
      - target: <PRODUCTS_A_PRIVATE_IP>:8080
      - target: <PRODUCTS_B_PRIVATE_IP>:8080
