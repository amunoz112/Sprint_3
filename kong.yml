_format_version: "2.1"

services:
  - name: products-svc
    url: http://products_upstream
    routes:
      - name: products-route
        paths:
          - /products
        strip_path: false

upstreams:
  - name: products_upstream
    healthchecks:
      threshhold: 50
      active:
        http_path: /products/health
        timeout: 10
        healthy:
          interval: 5          
          successes: 3
        unhealthy:
          interval: 5          
          tcp_failures: 3
    targets:
      - target: 172.31.28.65:8080
        weight: 100
      - target: 172.31.28.2:8080
        weight: 100